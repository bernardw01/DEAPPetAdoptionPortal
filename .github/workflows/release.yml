name: Publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  validate-and-release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify tag matches template version
        run: test "${GITHUB_REF_NAME}" = "v$(tr -d '\n' < VERSION)"
      - name: Install pinned Wasp CLI
        run: npm install --global @wasp.sh/wasp-cli@0.26.1
      - name: Generate Wasp packages and install dependencies
        run: wasp install
      - name: Validate release candidate
        run: npm run sdlc:validate
      - name: Extract release notes
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
